<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>puzzle 4 — the transmission</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Comic+Neue:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --font-comic: "Comic Sans MS", "Comic Neue", cursive, sans-serif;
  --font-papyrus: "Papyrus", "Cinzel Decorative", fantasy, serif;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 2.5rem 1rem;
  font-family: var(--font-comic);
  background: radial-gradient(circle at center, #180324 0%, #070112 60%, #000000 100%);
  color: #f3e8ff;
  text-align: center;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow-x: hidden;
}
.container {
  width: 100%;
  max-width: 580px;
}
h1 {
  font-family: var(--font-papyrus);
  font-size: clamp(2rem, 5vw, 2.7rem);
  margin: 0 0 0.5rem;
  color: #ffd700;
  text-shadow: 0 0 18px rgba(255, 215, 0, 0.45), 2px 2px 4px #000;
  font-weight: normal;
}
.subtitle {
  font-size: 1.1rem;
  color: #c084fc;
  margin-bottom: 2rem;
  font-style: italic;
}
.card {
  background: rgba(255, 255, 255, 0.05);
  border: 2px dashed #ffd700;
  border-radius: 18px;
  padding: 2rem 1.5rem;
  box-shadow: 0 0 32px rgba(168, 85, 247, 0.16);
  margin-bottom: 1.75rem;
}
.card.shake {
  animation: cardShake 0.35s ease-in-out;
}
.signal-label {
  font-family: var(--font-papyrus);
  font-size: 1rem;
  letter-spacing: 0.08em;
  color: #ffd700;
  margin-bottom: 1rem;
}
audio {
  width: 100%;
  max-width: 440px;
  border-radius: 999px;
  margin-bottom: 1rem;
}
.speed-row {
  display: flex;
  justify-content: center;
  gap: 0.55rem;
  flex-wrap: wrap;
}
.speed-btn {
  padding: 0.38rem 0.9rem;
  font-family: var(--font-comic);
  font-size: 0.9rem;
  color: #ffd700;
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid rgba(255, 215, 0, 0.45);
  border-radius: 999px;
  cursor: pointer;
  transition: background 0.2s, color 0.2s;
}
.speed-btn.active,
.speed-btn:hover {
  background: #ffd700;
  color: #1a0033;
}
.answer-form {
  display: flex;
  flex-direction: column;
  gap: 0.9rem;
  max-width: 340px;
  margin: 0 auto;
}
.answer-form input {
  width: 100%;
  padding: 0.85rem 1rem;
  font-size: 1.1rem;
  font-family: var(--font-comic);
  text-align: center;
  color: #ffd700;
  background: rgba(255, 255, 255, 0.07);
  border: 2px dashed #ffd700;
  border-radius: 14px;
  outline: none;
}
.answer-form input::placeholder {
  color: rgba(255, 215, 0, 0.55);
}
.btn {
  padding: 0.85rem 2rem;
  font-size: 1.15rem;
  font-family: var(--font-papyrus);
  background: #ffd700;
  color: #1a0033;
  border: 4px solid #1a0033;
  border-radius: 30px;
  cursor: pointer;
  box-shadow: 0 5px 0 #6c345a;
  transition: transform 0.1s;
}
.btn:active {
  transform: translateY(4px);
  box-shadow: 0 0 0 #6c345a;
}
.btn:disabled {
  opacity: 0.65;
  cursor: wait;
}
.status-msg {
  min-height: 1.5em;
  margin-top: 1rem;
  font-size: 0.95rem;
  color: #ff6b6b;
  font-style: italic;
}

/* Modal popup */
.popup-backdrop {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 1.5rem;
  background: rgba(0, 0, 0, 0.78);
  backdrop-filter: blur(6px);
}
.popup-backdrop.open {
  display: flex;
  animation: fadeIn 0.25s ease-out;
}
.popup-card {
  max-width: 500px;
  width: 100%;
  background: radial-gradient(circle at top, #1b0633 0%, #090112 100%);
  border: 2px solid #ffd700;
  border-radius: 18px;
  padding: 2rem 1.6rem;
  box-shadow: 0 0 36px rgba(255, 215, 0, 0.24);
  animation: popIn 0.28s cubic-bezier(0.22, 1, 0.36, 1);
}
.popup-card h2 {
  font-family: var(--font-papyrus);
  margin: 0 0 0.75rem;
  color: #ffd700;
  font-size: 1.5rem;
}
.popup-card p {
  margin: 0 0 1.4rem;
  line-height: 1.65;
  color: #f3e8ff;
}

/* FX & Finale void screen */
.fx-layer {
  position: fixed;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
  z-index: 55;
}
.rain-item {
  position: absolute;
  top: -3.5rem;
  user-select: none;
  will-change: transform, opacity;
  animation: rainFall var(--dur, 2.4s) linear var(--delay, 0s) forwards;
}
.void-screen {
  position: fixed;
  inset: 0;
  z-index: 60;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 2rem 1.5rem;
  background: radial-gradient(circle at center, #0d0218 0%, #040008 52%, #000000 100%);
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition: opacity 0.9s ease, visibility 0.9s ease;
}
.void-screen.active {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
}
.void-content {
  max-width: 680px;
  width: 100%;
  text-align: center;
}
.void-title {
  font-family: var(--font-papyrus);
  font-size: clamp(1.8rem, 4.5vw, 2.5rem);
  color: #ffd700;
  text-shadow: 0 0 20px rgba(255, 215, 0, 0.45);
  margin: 0 0 1.25rem;
}
.void-text {
  font-family: var(--font-comic);
  font-size: clamp(1.1rem, 2.8vw, 1.45rem);
  line-height: 1.8;
  color: #f3e8ff;
  min-height: 4em;
}
.void-cursor {
  display: inline-block;
  width: 0.12em;
  height: 1.05em;
  margin-left: 0.15em;
  vertical-align: text-bottom;
  background: #ffd700;
  box-shadow: 0 0 10px #ffd700;
  animation: blinkCursor 0.75s steps(1) infinite;
}
.final-fact-wrap {
  margin-top: 2rem;
  opacity: 0;
  transform: translateY(10px);
  transition: opacity 0.7s ease, transform 0.7s ease;
  pointer-events: none;
}
.final-fact-wrap.visible {
  opacity: 1;
  transform: translateY(0);
  pointer-events: auto;
}
.final-fact-wrap.shake {
  animation: cardShake 0.35s ease-in-out;
}

@keyframes rainFall {
  0% { transform: translateY(0) rotate(0deg); opacity: 0; }
  10% { opacity: 1; }
  90% { opacity: 1; }
  100% { transform: translateY(115vh) rotate(var(--spin, 360deg)); opacity: 0; }
}
@keyframes cardShake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-8px); }
  40% { transform: translateX(8px); }
  60% { transform: translateX(-6px); }
  80% { transform: translateX(6px); }
}
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
@keyframes popIn {
  from { opacity: 0; transform: scale(0.9) translateY(8px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}
@keyframes blinkCursor {
  0%, 49% { opacity: 1; }
  50%, 100% { opacity: 0; }
}
</style>
</head>
<body>

<div class="container">
  <h1>puzzle 4</h1>
  <div class="subtitle">listen closely, arsonist.</div>

  <div class="card" id="mainCard">
    <div class="signal-label">incoming morse transmission</div>
    <audio id="morseAudio" controls preload="auto" src="morse.wav"></audio>
    <div class="speed-row" id="speedRow">
      <button type="button" class="speed-btn" data-rate="0.7">0.7x slow</button>
      <button type="button" class="speed-btn active" data-rate="1">1x normal</button>
      <button type="button" class="speed-btn" data-rate="1.25">1.25x fast</button>
    </div>
  </div>

  <form class="answer-form" id="answerForm">
    <input type="text" id="answerInput" autocomplete="off" placeholder="enter your answer..." required />
    <button type="submit" class="btn" id="submitBtn">submit</button>
  </form>

  <div class="status-msg" id="statusMsg"></div>
</div>

<div class="popup-backdrop" id="popupBackdrop" role="dialog" aria-modal="true" aria-labelledby="popupTitle">
  <div class="popup-card">
    <h2 id="popupTitle"></h2>
    <p id="popupMessage"></p>
    <button type="button" class="btn" id="popupClose">close</button>
  </div>
</div>

<div class="fx-layer" id="fxLayer" aria-hidden="true"></div>

<div class="void-screen" id="voidScreen" aria-live="polite">
  <div class="void-content">
    <h2 class="void-title" id="voidTitle"></h2>
    <div class="void-text"><span id="voidTyped"></span><span class="void-cursor" id="voidCursor"></span></div>
    <div class="final-fact-wrap" id="finalFactWrap">
      <form class="answer-form" id="finalFactForm">
        <input type="text" id="finalFactInput" autocomplete="off" placeholder="type the fun fact..." required />
        <button type="submit" class="btn" id="finalFactBtn">submit</button>
      </form>
      <div class="status-msg" id="finalFactStatus"></div>
    </div>
  </div>
</div>

<script>
const ITERATIONS = 100000;
const BRANCH_A = {
  salt: 'elation-p4-a-salt',
  tag: 'DHZ2jUgA1X/J52znvW6rV2kbc4wqTqQPrYWEy+PH6gA=',
  ct: 'pmbmYHNT100EWJa6A7BMOLeQVGUYNk8oghClHpBYIPEdR12Yh64My2B5oK9equWUFt90lZAAan85a27JMQU1uNr7cnr51+2mJLBU0xKF4f3/qrQZWw+Aveas6MmhgknAaWYvQ0M6J7WCKZxggYkFFQWZwGrXtpUe/J1BsNK96/d+/dq1jfdG9oUqfPf+cG476wkrSxd3tqK2tQJARogIKA=='
};
const BRANCH_B = {
  salt: 'elation-p4-b-salt',
  tag: 'aWu1ESLWAZ6MSxSnn0z8Raf3M6SFmtCeWmWeDCnsO3w=',
  ct: 'IQbLi9S/wi8a1mxQhBoaldfpV4NISrQus9DQ4GVTctsmNJLRsXEH72vcrjjb6+GjTzEoHMbqkLsT3xp2n8VREUaIPjdYQXtfjGe2aKgD3g1qxs+j7J9CTBhDOUBg+Jtj/2oDTfR5gDM='
};
const FINAL_FACT_SALT = 'elation-p4-final-salt';
const FINAL_FACT_HASHES = [
  '387ce7ed2355382fbecdebc16cd888a57f254b743559e65c4f4d4852af75c628',
  '97dd20d7955895042b7644852cbe49af1e75bdd7cf0b14007911aa0f6cbb3f27'
];

const te = new TextEncoder();
const td = new TextDecoder();

function b64ToBytes(b64) {
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

function concatBytes(a, b) {
  const out = new Uint8Array(a.length + b.length);
  out.set(a, 0);
  out.set(b, a.length);
  return out;
}

const K = new Uint32Array([
  0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5,
  0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174,
  0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,
  0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967,
  0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85,
  0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
  0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3,
  0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2
]);

function sha256Sync(data) {
  const len = data.length;
  const bitLen = len * 8;
  const paddedLen = Math.ceil((len + 9) / 64) * 64;
  const padded = new Uint8Array(paddedLen);
  padded.set(data);
  padded[len] = 0x80;
  const dv = new DataView(padded.buffer);
  dv.setUint32(paddedLen - 8, Math.floor(bitLen / 0x100000000), false);
  dv.setUint32(paddedLen - 4, bitLen >>> 0, false);

  let h0 = 0x6a09e667, h1 = 0xbb67ae85, h2 = 0x3c6ef372, h3 = 0xa54ff53a;
  let h4 = 0x510e527f, h5 = 0x9b05688c, h6 = 0x1f83d9ab, h7 = 0x5be0cd19;
  const w = new Uint32Array(64);

  for (let off = 0; off < paddedLen; off += 64) {
    for (let i = 0; i < 16; i++) w[i] = dv.getUint32(off + i * 4, false);
    for (let i = 16; i < 64; i++) {
      const s0 = ((w[i - 15] >>> 7) | (w[i - 15] << 25)) ^ ((w[i - 15] >>> 18) | (w[i - 15] << 14)) ^ (w[i - 15] >>> 3);
      const s1 = ((w[i - 2] >>> 17) | (w[i - 2] << 15)) ^ ((w[i - 2] >>> 19) | (w[i - 2] << 13)) ^ (w[i - 2] >>> 10);
      w[i] = (w[i - 16] + s0 + w[i - 7] + s1) >>> 0;
    }
    let a = h0, b = h1, c = h2, d = h3, e = h4, f = h5, g = h6, h = h7;
    for (let i = 0; i < 64; i++) {
      const S1 = ((e >>> 6) | (e << 26)) ^ ((e >>> 11) | (e << 21)) ^ ((e >>> 25) | (e << 7));
      const ch = (e & f) ^ ((~e) & g);
      const t1 = (h + S1 + ch + K[i] + w[i]) >>> 0;
      const S0 = ((a >>> 2) | (a << 30)) ^ ((a >>> 13) | (a << 19)) ^ ((a >>> 22) | (a << 10));
      const maj = (a & b) ^ (a & c) ^ (b & c);
      const t2 = (S0 + maj) >>> 0;
      h = g; g = f; f = e; e = (d + t1) >>> 0;
      d = c; c = b; b = a; a = (t1 + t2) >>> 0;
    }
    h0 = (h0 + a) >>> 0; h1 = (h1 + b) >>> 0; h2 = (h2 + c) >>> 0; h3 = (h3 + d) >>> 0;
    h4 = (h4 + e) >>> 0; h5 = (h5 + f) >>> 0; h6 = (h6 + g) >>> 0; h7 = (h7 + h) >>> 0;
  }

  const out = new Uint8Array(32);
  const outView = new DataView(out.buffer);
  [h0, h1, h2, h3, h4, h5, h6, h7].forEach((v, idx) => outView.setUint32(idx * 4, v, false));
  return out;
}

function hmacSha256Sync(key, msg) {
  const k = key.length > 64 ? sha256Sync(key) : key;
  const ipad = new Uint8Array(64);
  const opad = new Uint8Array(64);
  ipad.fill(0x36);
  opad.fill(0x5c);
  for (let i = 0; i < k.length; i++) {
    ipad[i] ^= k[i];
    opad[i] ^= k[i];
  }
  return sha256Sync(concatBytes(opad, sha256Sync(concatBytes(ipad, msg))));
}

function pbkdf2Sha256Sync(passwordBytes, saltBytes, iterations) {
  const block1 = new Uint8Array(saltBytes.length + 4);
  block1.set(saltBytes, 0);
  block1[saltBytes.length + 3] = 1;
  let u = hmacSha256Sync(passwordBytes, block1);
  const out = new Uint8Array(u);
  for (let i = 1; i < iterations; i++) {
    u = hmacSha256Sync(passwordBytes, u);
    for (let j = 0; j < 32; j++) out[j] ^= u[j];
  }
  return out;
}

async function sha256Bytes(data) {
  if (window.crypto && window.crypto.subtle) {
    return new Uint8Array(await window.crypto.subtle.digest('SHA-256', data));
  }
  return sha256Sync(data);
}

async function deriveMasterKey(guess, saltText) {
  const passBytes = te.encode(guess);
  const saltBytes = te.encode(saltText);
  if (window.crypto && window.crypto.subtle) {
    const keyMat = await window.crypto.subtle.importKey('raw', passBytes, 'PBKDF2', false, ['deriveBits']);
    const bits = await window.crypto.subtle.deriveBits(
      { name: 'PBKDF2', salt: saltBytes, iterations: ITERATIONS, hash: 'SHA-256' },
      keyMat,
      256
    );
    return new Uint8Array(bits);
  }
  return pbkdf2Sha256Sync(passBytes, saltBytes, ITERATIONS);
}

async function tryDecrypt(guess, bundle) {
  const master = await deriveMasterKey(guess, bundle.salt);
  const encKey = await sha256Bytes(concatBytes(te.encode('enc:'), master));
  const macKey = await sha256Bytes(concatBytes(te.encode('mac:'), master));

  const ct = b64ToBytes(bundle.ct);
  const expectedTag = b64ToBytes(bundle.tag);
  const actualTag = await sha256Bytes(concatBytes(macKey, ct));

  let diff = 0;
  for (let i = 0; i < 32; i++) diff |= expectedTag[i] ^ actualTag[i];
  if (diff !== 0) return null;

  const pt = new Uint8Array(ct.length);
  const ctrBuf = new Uint8Array(4);
  const ctrView = new DataView(ctrBuf.buffer);
  for (let offset = 0, ctr = 0; offset < ct.length; offset += 32, ctr++) {
    ctrView.setUint32(0, ctr, false);
    const block = await sha256Bytes(concatBytes(encKey, ctrBuf));
    for (let i = 0; i < 32 && offset + i < ct.length; i++) {
      pt[offset + i] = ct[offset + i] ^ block[i];
    }
  }
  return JSON.parse(td.decode(pt));
}

const morseAudio = document.getElementById('morseAudio');
const speedRow = document.getElementById('speedRow');
const mainCard = document.getElementById('mainCard');
const answerForm = document.getElementById('answerForm');
const answerInput = document.getElementById('answerInput');
const submitBtn = document.getElementById('submitBtn');
const statusMsg = document.getElementById('statusMsg');
const popupBackdrop = document.getElementById('popupBackdrop');
const popupTitle = document.getElementById('popupTitle');
const popupMessage = document.getElementById('popupMessage');
const popupClose = document.getElementById('popupClose');
const fxLayer = document.getElementById('fxLayer');
const voidScreen = document.getElementById('voidScreen');
const voidTitle = document.getElementById('voidTitle');
const voidTyped = document.getElementById('voidTyped');
const finalFactWrap = document.getElementById('finalFactWrap');
const finalFactForm = document.getElementById('finalFactForm');
const finalFactInput = document.getElementById('finalFactInput');
const finalFactBtn = document.getElementById('finalFactBtn');
const finalFactStatus = document.getElementById('finalFactStatus');

speedRow.addEventListener('click', (e) => {
  const btn = e.target.closest('.speed-btn');
  if (!btn) return;
  const rate = parseFloat(btn.dataset.rate);
  if (!Number.isFinite(rate)) return;
  morseAudio.playbackRate = rate;
  speedRow.querySelectorAll('.speed-btn').forEach(b => b.classList.toggle('active', b === btn));
});

function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

function rainFinale(icons) {
  const list = Array.isArray(icons) && icons.length ? icons : ['🔥', '✨'];
  for (let i = 0; i < 65; i++) {
    const el = document.createElement('span');
    el.className = 'rain-item';
    el.textContent = list[Math.floor(Math.random() * list.length)];
    el.style.left = `${Math.random() * 96}vw`;
    el.style.fontSize = `${1.8 + Math.random() * 1.8}rem`;
    el.style.setProperty('--dur', `${1.7 + Math.random() * 1.3}s`);
    el.style.setProperty('--delay', `${Math.random() * 1.0}s`);
    el.style.setProperty('--spin', `${(Math.random() < 0.5 ? -1 : 1) * (180 + Math.random() * 360)}deg`);
    fxLayer.appendChild(el);
    setTimeout(() => el.remove(), 3300);
  }
}

async function showFinale(data) {
  voidTitle.textContent = data.title;
  voidScreen.classList.add('active');
  await sleep(800);

  let rendered = '';
  for (let i = 0; i < data.message.length; i++) {
    rendered += data.message[i];
    voidTyped.textContent = rendered;
    const ch = data.message[i];
    const delay = ch === ',' ? 130 : (ch === '.' || ch === '!' || ch === '?') ? 220 : 40;
    await sleep(delay);
  }

  await sleep(350);
  finalFactWrap.classList.add('visible');
  setTimeout(() => finalFactInput.focus(), 80);
}

function normalizeFactInput(str) {
  return str.toLowerCase().replace(/[^a-z0-9\s]/g, '').replace(/\s+/g, ' ').trim();
}

async function checkFinalFact(raw) {
  const norm = normalizeFactInput(raw);
  if (!norm) return false;
  const master = await deriveMasterKey(norm, FINAL_FACT_SALT);
  const hex = Array.from(master, b => b.toString(16).padStart(2, '0')).join('');
  return FINAL_FACT_HASHES.includes(hex);
}

finalFactForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const raw = finalFactInput.value.trim();
  if (!raw) return;

  finalFactBtn.disabled = true;
  finalFactStatus.textContent = 'checking memory...';

  try {
    const ok = await checkFinalFact(raw);
    if (ok) {
      finalFactStatus.style.color = '#4ade80';
      finalFactStatus.textContent = 'yes! welcome to the finale...';
      await sleep(750);
      location.href = 'credits.html';
    } else {
      finalFactStatus.style.color = '#ff6b6b';
      finalFactStatus.textContent = 'nope. go check the facts, arsonist.';
      finalFactWrap.classList.remove('shake');
      void finalFactWrap.offsetWidth;
      finalFactWrap.classList.add('shake');
      finalFactInput.select();
    }
  } catch (err) {
    console.error(err);
    finalFactStatus.textContent = 'something malfunctioned. try again.';
  } finally {
    finalFactBtn.disabled = false;
  }
});

function openPopup(data) {
  popupTitle.textContent = data.title;
  popupMessage.textContent = data.message;
  popupBackdrop.classList.add('open');
}

function closePopup() {
  popupBackdrop.classList.remove('open');
}

popupClose.addEventListener('click', closePopup);
popupBackdrop.addEventListener('click', (e) => {
  if (e.target === popupBackdrop) closePopup();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && popupBackdrop.classList.contains('open')) closePopup();
});

answerForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const raw = answerInput.value.trim();
  if (!raw) return;

  submitBtn.disabled = true;
  statusMsg.textContent = 'decoding...';

  try {
    const branchA = await tryDecrypt(raw.toLowerCase(), BRANCH_A);
    if (branchA) {
      statusMsg.textContent = '';
      openPopup(branchA);
      return;
    }

    const normalized = raw.replace(/\uFE0F/g, '');
    const branchB = await tryDecrypt(normalized, BRANCH_B);
    if (branchB) {
      statusMsg.textContent = '';
      answerForm.style.display = 'none';
      morseAudio.pause();
      rainFinale(branchB.icons);
      await sleep(2100);
      await showFinale(branchB);
      return;
    }

    statusMsg.textContent = 'not quite. listen closer, arsonist.';
    mainCard.classList.remove('shake');
    void mainCard.offsetWidth;
    mainCard.classList.add('shake');
    answerInput.select();
  } catch (err) {
    console.error(err);
    statusMsg.textContent = 'something malfunctioned. try again.';
  } finally {
    submitBtn.disabled = false;
  }
});
</script>
