<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>puzzle 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Comic+Neue:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --font-comic: "Comic Sans MS", "Comic Neue", cursive, sans-serif;
  --font-papyrus: "Papyrus", "Cinzel Decorative", fantasy, serif;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 2rem 1.5rem;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  background: radial-gradient(circle at center, #0d0218 0%, #040008 55%, #000000 100%);
  color: #f3e8ff;
  font-family: var(--font-papyrus);
  overflow-x: hidden;
}
.prompt {
  max-width: 720px;
  font-size: clamp(1.3rem, 3.5vw, 2rem);
  line-height: 1.7;
  color: #f3e8ff;
  text-shadow: 0 0 16px rgba(192, 132, 252, 0.55), 0 0 32px rgba(255, 215, 0, 0.16);
  user-select: text;
}
.prompt::selection {
  background: rgba(255, 215, 0, 0.3);
  color: #ffd700;
}

.popup-backdrop {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 1.5rem;
  background: rgba(0, 0, 0, 0.78);
  backdrop-filter: blur(6px);
}
.popup-backdrop.open {
  display: flex;
  animation: fadeIn 0.25s ease-out;
}
.popup-card {
  max-width: 520px;
  width: 100%;
  background: radial-gradient(circle at top, #1b0633 0%, #090112 100%);
  border: 2px solid #ffd700;
  border-radius: 18px;
  padding: 2rem 1.75rem;
  box-shadow: 0 0 36px rgba(255, 215, 0, 0.22), 0 0 60px rgba(168, 85, 247, 0.25);
  animation: popIn 0.28s cubic-bezier(0.22, 1, 0.36, 1);
}
.popup-card.shake {
  animation: cardShake 0.35s ease-in-out;
}
.popup-message {
  margin: 0 0 1.35rem;
  font-family: var(--font-comic);
  font-size: 1.15rem;
  line-height: 1.7;
  color: #ffd700;
}
.answer-form {
  display: flex;
  flex-direction: column;
  gap: 0.9rem;
  max-width: 340px;
  margin: 2rem auto 0;
}
.answer-form input {
  width: 100%;
  padding: 0.85rem 1rem;
  font-size: 1.05rem;
  font-family: var(--font-comic);
  text-align: center;
  color: #ffd700;
  background: rgba(255, 255, 255, 0.07);
  border: 2px dashed #ffd700;
  border-radius: 14px;
  outline: none;
}
.answer-form input::placeholder {
  color: rgba(255, 215, 0, 0.55);
}
.btn {
  padding: 0.75rem 1.8rem;
  font-size: 1.05rem;
  font-family: var(--font-papyrus);
  background: #ffd700;
  color: #1a0033;
  border: 3px solid #1a0033;
  border-radius: 28px;
  cursor: pointer;
  box-shadow: 0 4px 0 #6c345a;
  transition: transform 0.1s;
}
.btn:active {
  transform: translateY(3px);
  box-shadow: 0 0 0 #6c345a;
}
.btn:disabled {
  opacity: 0.65;
  cursor: wait;
}
.status-msg {
  min-height: 1.5em;
  margin-top: 1rem;
  font-family: var(--font-comic);
  font-size: 0.95rem;
  color: #ff6b6b;
  font-style: italic;
}

/* FX overlay for raining joy / burning cats */
.fx-layer {
  position: fixed;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
  z-index: 55;
}
.rain-joy {
  position: absolute;
  top: -3.5rem;
  user-select: none;
  will-change: transform, opacity;
  animation: rainFall var(--dur, 2.4s) linear var(--delay, 0s) forwards;
}
@keyframes rainFall {
  0% {
    transform: translateY(0) rotate(0deg);
    opacity: 0;
  }
  10% {
    opacity: 1;
  }
  90% {
    opacity: 1;
  }
  100% {
    transform: translateY(115vh) rotate(var(--spin, 360deg));
    opacity: 0;
  }
}

.burning-cat {
  position: absolute;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  animation: catBurn 2.8s ease-in forwards;
}
.burning-cat .cat-char {
  position: relative;
  z-index: 2;
  display: inline-block;
  filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.45)) drop-shadow(0 0 14px #ff5500);
  animation: catShake 0.14s infinite alternate;
}
.burning-cat .flame-back {
  position: absolute;
  z-index: 1;
  top: -0.32em;
  left: 50%;
  transform: translateX(-50%);
  font-size: 1.35em;
  filter: drop-shadow(0 0 14px #ff3b00);
  animation: flameFlicker 0.18s infinite alternate;
}
.burning-cat .flame-side {
  position: absolute;
  z-index: 3;
  bottom: -0.08em;
  font-size: 0.52em;
  filter: drop-shadow(0 0 8px #ff5500);
  animation: flameSideFlicker 0.16s infinite alternate;
}
.burning-cat .flame-side.left { left: -0.22em; }
.burning-cat .flame-side.right { right: -0.22em; animation-delay: 0.08s; }
@keyframes catShake {
  0% { transform: translate(-2px, 1px) rotate(-6deg) scale(1); }
  100% { transform: translate(2px, -2px) rotate(6deg) scale(1.06); }
}
@keyframes flameFlicker {
  0% { transform: translateX(-50%) scale(0.95) rotate(-4deg); opacity: 0.9; }
  100% { transform: translateX(-50%) scale(1.16) rotate(4deg); opacity: 1; }
}
@keyframes flameSideFlicker {
  0% { transform: scale(0.9) rotate(-8deg); opacity: 0.85; }
  100% { transform: scale(1.18) rotate(8deg); opacity: 1; }
}
@keyframes catBurn {
  0% { opacity: 0; transform: scale(0.6); }
  12% { opacity: 1; transform: scale(1.1); }
  65% { opacity: 1; transform: scale(1) translateY(-8px); filter: saturate(1.7) contrast(1.1); }
  100% { opacity: 0; transform: scale(0.55) translateY(-42px); filter: brightness(0.4); }
}

/* Void transition screen to Puzzle 3 */
.void-screen {
  position: fixed;
  inset: 0;
  z-index: 60;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 2rem 1.5rem;
  background: radial-gradient(circle at center, #0d0218 0%, #040008 52%, #000000 100%);
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition: opacity 0.9s ease, visibility 0.9s ease;
}
.void-screen.active {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
}
.void-content {
  max-width: 680px;
  width: 100%;
  text-align: center;
}
.void-text {
  font-family: var(--font-papyrus);
  font-size: clamp(1.25rem, 3.2vw, 1.85rem);
  line-height: 1.8;
  color: #f3e8ff;
  text-shadow: 0 0 14px rgba(192, 132, 252, 0.55), 0 0 32px rgba(255, 215, 0, 0.18);
  white-space: pre-line;
  min-height: 4.5em;
}
.void-cursor {
  display: inline-block;
  width: 0.12em;
  height: 1.05em;
  margin-left: 0.15em;
  vertical-align: text-bottom;
  background: #ffd700;
  box-shadow: 0 0 10px #ffd700;
  animation: blinkCursor 0.75s steps(1) infinite;
}
.next-trial-wrap {
  margin-top: 2.5rem;
  opacity: 0;
  transform: translateY(10px);
  transition: opacity 0.8s ease, transform 0.8s ease;
  pointer-events: none;
}
.next-trial-wrap.visible {
  opacity: 1;
  transform: translateY(0);
  pointer-events: auto;
}
.void-note {
  margin-top: 1rem;
  font-family: var(--font-comic);
  font-size: 0.95rem;
  color: #c084fc;
  font-style: italic;
  min-height: 1.4em;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
@keyframes popIn {
  from { opacity: 0; transform: scale(0.9) translateY(8px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}
@keyframes cardShake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-8px); }
  40% { transform: translateX(8px); }
  60% { transform: translateX(-6px); }
  80% { transform: translateX(6px); }
}
@keyframes blinkCursor {
  0%, 49% { opacity: 1; }
  50%, 100% { opacity: 0; }
}
</style>
</head>
<body>

<main>
  <p class="prompt" id="promptText">materialise the old hunt to find the new code, erudite</p>
  <form class="answer-form" id="answerForm">
    <input type="text" id="answerInput" autocomplete="off" placeholder="enter the code..." required />
    <button type="submit" class="btn" id="submitBtn">unlock</button>
  </form>
  <div class="status-msg" id="statusMsg"></div>
</main>

<div class="popup-backdrop" id="popupBackdrop" role="dialog" aria-modal="true" aria-labelledby="popupMessage">
  <div class="popup-card" id="popupCard">
    <p class="popup-message" id="popupMessage"></p>
    <button type="button" class="btn" id="popupClose">close</button>
  </div>
</div>

<div class="fx-layer" id="fxLayer" aria-hidden="true"></div>

<div class="void-screen" id="voidScreen" aria-live="polite">
  <div class="void-content">
    <div class="void-text"><span id="voidTyped"></span><span class="void-cursor" id="voidCursor"></span></div>
    <div class="next-trial-wrap" id="nextTrialWrap">
      <button type="button" class="btn" id="nextTrialBtn">enter puzzle 3</button>
      <div class="void-note" id="voidNote"></div>
    </div>
  </div>
</div>

<script>
const POPUP_TEXT = 'So you remembered? I guess you did, but do you remember the Princess of Our World?';
const SALT_TEXT = 'elation-riddle-2-salt';
const ITERATIONS = 150000;
const EXPECTED_TAG_B64 = 'ihoaKVBtZvENbf6ShpgvnhvQVLnQyllhDVdSqS9r5bU=';
const CIPHERTEXT_B64 = 'T3hd8HfX4s4zbswgdwhcz5f4Bg/GREIBhhUOlA66UD0ugtgwkb06UYCmf9bXhQO/6VJh1e0DA8AJGZnRz7CYMMkswXbiVYDuRYv/NEypV4ZZnisbXEkTcZJffM1bPzFBBNV3z0Sh1wEo';

const te = new TextEncoder();
const td = new TextDecoder();

function b64ToBytes(b64) {
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

function concatBytes(a, b) {
  const out = new Uint8Array(a.length + b.length);
  out.set(a, 0);
  out.set(b, a.length);
  return out;
}

const K = new Uint32Array([
  0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5,
  0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174,
  0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,
  0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967,
  0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85,
  0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
  0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3,
  0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2
]);

function sha256Sync(data) {
  const len = data.length;
  const bitLen = len * 8;
  const paddedLen = Math.ceil((len + 9) / 64) * 64;
  const padded = new Uint8Array(paddedLen);
  padded.set(data);
  padded[len] = 0x80;
  const dv = new DataView(padded.buffer);
  dv.setUint32(paddedLen - 8, Math.floor(bitLen / 0x100000000), false);
  dv.setUint32(paddedLen - 4, bitLen >>> 0, false);

  let h0 = 0x6a09e667, h1 = 0xbb67ae85, h2 = 0x3c6ef372, h3 = 0xa54ff53a;
  let h4 = 0x510e527f, h5 = 0x9b05688c, h6 = 0x1f83d9ab, h7 = 0x5be0cd19;
  const w = new Uint32Array(64);

  for (let off = 0; off < paddedLen; off += 64) {
    for (let i = 0; i < 16; i++) w[i] = dv.getUint32(off + i * 4, false);
    for (let i = 16; i < 64; i++) {
      const s0 = ((w[i - 15] >>> 7) | (w[i - 15] << 25)) ^ ((w[i - 15] >>> 18) | (w[i - 15] << 14)) ^ (w[i - 15] >>> 3);
      const s1 = ((w[i - 2] >>> 17) | (w[i - 2] << 15)) ^ ((w[i - 2] >>> 19) | (w[i - 2] << 13)) ^ (w[i - 2] >>> 10);
      w[i] = (w[i - 16] + s0 + w[i - 7] + s1) >>> 0;
    }
    let a = h0, b = h1, c = h2, d = h3, e = h4, f = h5, g = h6, h = h7;
    for (let i = 0; i < 64; i++) {
      const S1 = ((e >>> 6) | (e << 26)) ^ ((e >>> 11) | (e << 21)) ^ ((e >>> 25) | (e << 7));
      const ch = (e & f) ^ ((~e) & g);
      const t1 = (h + S1 + ch + K[i] + w[i]) >>> 0;
      const S0 = ((a >>> 2) | (a << 30)) ^ ((a >>> 13) | (a << 19)) ^ ((a >>> 22) | (a << 10));
      const maj = (a & b) ^ (a & c) ^ (b & c);
      const t2 = (S0 + maj) >>> 0;
      h = g; g = f; f = e; e = (d + t1) >>> 0;
      d = c; c = b; b = a; a = (t1 + t2) >>> 0;
    }
    h0 = (h0 + a) >>> 0; h1 = (h1 + b) >>> 0; h2 = (h2 + c) >>> 0; h3 = (h3 + d) >>> 0;
    h4 = (h4 + e) >>> 0; h5 = (h5 + f) >>> 0; h6 = (h6 + g) >>> 0; h7 = (h7 + h) >>> 0;
  }

  const out = new Uint8Array(32);
  const outView = new DataView(out.buffer);
  [h0, h1, h2, h3, h4, h5, h6, h7].forEach((val, idx) => outView.setUint32(idx * 4, val, false));
  return out;
}

function hmacSha256Sync(key, msg) {
  const k = key.length > 64 ? sha256Sync(key) : key;
  const ipad = new Uint8Array(64);
  const opad = new Uint8Array(64);
  ipad.fill(0x36);
  opad.fill(0x5c);
  for (let i = 0; i < k.length; i++) {
    ipad[i] ^= k[i];
    opad[i] ^= k[i];
  }
  return sha256Sync(concatBytes(opad, sha256Sync(concatBytes(ipad, msg))));
}

function pbkdf2Sha256Sync(passwordBytes, saltBytes, iterations) {
  const block1 = new Uint8Array(saltBytes.length + 4);
  block1.set(saltBytes, 0);
  block1[saltBytes.length + 3] = 1;
  let u = hmacSha256Sync(passwordBytes, block1);
  const out = new Uint8Array(u);
  for (let i = 1; i < iterations; i++) {
    u = hmacSha256Sync(passwordBytes, u);
    for (let j = 0; j < 32; j++) out[j] ^= u[j];
  }
  return out;
}

async function sha256Bytes(data) {
  if (window.crypto && window.crypto.subtle) {
    return new Uint8Array(await window.crypto.subtle.digest('SHA-256', data));
  }
  return sha256Sync(data);
}

async function deriveMasterKey(guess) {
  const passBytes = te.encode(guess);
  const saltBytes = te.encode(SALT_TEXT);
  if (window.crypto && window.crypto.subtle) {
    const keyMat = await window.crypto.subtle.importKey('raw', passBytes, 'PBKDF2', false, ['deriveBits']);
    const bits = await window.crypto.subtle.deriveBits(
      { name: 'PBKDF2', salt: saltBytes, iterations: ITERATIONS, hash: 'SHA-256' },
      keyMat,
      256
    );
    return new Uint8Array(bits);
  }
  return pbkdf2Sha256Sync(passBytes, saltBytes, ITERATIONS);
}

async function tryUnlock(guess) {
  const master = await deriveMasterKey(guess.trim().toLowerCase());
  const encKey = await sha256Bytes(concatBytes(te.encode('enc:'), master));
  const macKey = await sha256Bytes(concatBytes(te.encode('mac:'), master));

  const ct = b64ToBytes(CIPHERTEXT_B64);
  const expectedTag = b64ToBytes(EXPECTED_TAG_B64);
  const actualTag = await sha256Bytes(concatBytes(macKey, ct));

  let diff = 0;
  for (let i = 0; i < 32; i++) diff |= expectedTag[i] ^ actualTag[i];
  if (diff !== 0) return null;

  const pt = new Uint8Array(ct.length);
  const ctrBuf = new Uint8Array(4);
  const ctrView = new DataView(ctrBuf.buffer);
  for (let offset = 0, ctr = 0; offset < ct.length; offset += 32, ctr++) {
    ctrView.setUint32(0, ctr, false);
    const block = await sha256Bytes(concatBytes(encKey, ctrBuf));
    for (let i = 0; i < 32 && offset + i < ct.length; i++) {
      pt[offset + i] = ct[offset + i] ^ block[i];
    }
  }
  return JSON.parse(td.decode(pt));
}

const popupBackdrop = document.getElementById('popupBackdrop');
const popupMessage = document.getElementById('popupMessage');
const popupClose = document.getElementById('popupClose');
const answerForm = document.getElementById('answerForm');
const answerInput = document.getElementById('answerInput');
const submitBtn = document.getElementById('submitBtn');
const statusMsg = document.getElementById('statusMsg');

const fxLayer = document.getElementById('fxLayer');
const voidScreen = document.getElementById('voidScreen');
const voidTyped = document.getElementById('voidTyped');
const nextTrialWrap = document.getElementById('nextTrialWrap');
const nextTrialBtn = document.getElementById('nextTrialBtn');
const voidNote = document.getElementById('voidNote');

let selectAllAt = 0;
let lastTriggeredAt = 0;
let solved = false;

function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

function rainJoy() {
  const count = 65;
  for (let i = 0; i < count; i++) {
    const el = document.createElement('span');
    el.className = 'rain-joy';
    el.textContent = '😂';
    el.style.left = `${Math.random() * 96}vw`;
    el.style.fontSize = `${1.9 + Math.random() * 1.9}rem`;
    el.style.setProperty('--dur', `${1.7 + Math.random() * 1.3}s`);
    el.style.setProperty('--delay', `${Math.random() * 1.1}s`);
    el.style.setProperty('--spin', `${(Math.random() < 0.5 ? -1 : 1) * (180 + Math.random() * 360)}deg`);
    fxLayer.appendChild(el);
    setTimeout(() => el.remove(), 3400);
  }
}

function burnCats() {
  const cats = ['🐱', '🐈', '😺', '🙀'];
  const count = 16;
  for (let i = 0; i < count; i++) {
    setTimeout(() => {
      const wrap = document.createElement('span');
      wrap.className = 'burning-cat';
      wrap.style.left = `${8 + Math.random() * 78}vw`;
      wrap.style.top = `${12 + Math.random() * 68}vh`;
      wrap.style.fontSize = `${3.2 + Math.random() * 1.3}rem`;

      const flameBack = document.createElement('span');
      flameBack.className = 'flame-back';
      flameBack.textContent = '🔥';

      const cat = document.createElement('span');
      cat.className = 'cat-char';
      cat.textContent = cats[Math.floor(Math.random() * cats.length)];

      const flameLeft = document.createElement('span');
      flameLeft.className = 'flame-side left';
      flameLeft.textContent = '🔥';

      const flameRight = document.createElement('span');
      flameRight.className = 'flame-side right';
      flameRight.textContent = '🔥';

      wrap.append(flameBack, cat, flameLeft, flameRight);
      fxLayer.appendChild(wrap);
      setTimeout(() => wrap.remove(), 2900);
    }, i * 55);
  }
}

function normalizeText(str) {
  return str.toLowerCase().replace(/\s+/g, ' ').trim();
}

function selectionCoversPrompt() {
  const sel = window.getSelection ? normalizeText(window.getSelection().toString()) : '';
  return sel.includes('materialise the old hunt') && sel.includes('erudite');
}

function showRememberPopup() {
  if (solved) return;
  const now = Date.now();
  if (now - lastTriggeredAt < 300) return;
  lastTriggeredAt = now;
  popupMessage.textContent = POPUP_TEXT;
  popupBackdrop.classList.add('open');
}

function closePopup() {
  popupBackdrop.classList.remove('open');
}

document.addEventListener('keydown', (e) => {
  if (solved) return;
  const mod = e.ctrlKey || e.metaKey;
  const key = e.key.toLowerCase();
  const inInput = document.activeElement === answerInput;

  if (mod && key === 'a') {
    if (!inInput && !popupBackdrop.classList.contains('open')) {
      selectAllAt = Date.now();
    }
    return;
  }

  if (mod && key === 'c') {
    if (!inInput && !popupBackdrop.classList.contains('open')) {
      const recentSelectAll = Date.now() - selectAllAt < 10000;
      if (recentSelectAll || selectionCoversPrompt()) {
        setTimeout(showRememberPopup, 20);
      }
    }
    return;
  }

  if (key === 'escape' && popupBackdrop.classList.contains('open')) {
    closePopup();
  }
});

document.addEventListener('copy', () => {
  if (solved || popupBackdrop.classList.contains('open')) return;
  if (document.activeElement === answerInput && !selectionCoversPrompt()) return;
  const recentSelectAll = Date.now() - selectAllAt < 10000;
  if (recentSelectAll || selectionCoversPrompt()) {
    showRememberPopup();
  }
});

popupClose.addEventListener('click', closePopup);
popupBackdrop.addEventListener('click', (e) => {
  if (e.target === popupBackdrop) closePopup();
});

async function playVoidTransition(text) {
  voidScreen.classList.add('active');
  await sleep(800);

  let rendered = '';
  for (let i = 0; i < text.length; i++) {
    rendered += text[i];
    voidTyped.textContent = rendered;
    const ch = text[i];
    const delay = ch === ',' ? 140 : (ch === '.' || ch === '?') ? 260 : 42;
    await sleep(delay);
  }

  await sleep(400);
  nextTrialWrap.classList.add('visible');
}

nextTrialBtn.addEventListener('click', () => {
  location.href = 'puzzle3.html';
});

answerForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const guess = answerInput.value.trim();
  if (!guess) return;

  submitBtn.disabled = true;
  statusMsg.textContent = 'checking code...';

  try {
    const result = await tryUnlock(guess);
    if (result && typeof result.text === 'string') {
      solved = true;
      statusMsg.textContent = '';
      answerForm.style.display = 'none';
      closePopup();
      rainJoy();
      await sleep(2200);
      await playVoidTransition(result.text);
    } else {
      statusMsg.textContent = 'wrong. the cats burn.';
      burnCats();
      answerInput.select();
    }
  } catch (err) {
    console.error(err);
    statusMsg.textContent = 'something malfunctioned. try again.';
  } finally {
    submitBtn.disabled = false;
  }
});
</script>
</body>
</html>
