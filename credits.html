<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The Elation — Credits</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Comic+Neue:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --font-comic: "Comic Sans MS", "Comic Neue", cursive, sans-serif;
  --font-papyrus: "Papyrus", "Cinzel Decorative", fantasy, serif;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 2.5rem 1.25rem;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  font-family: var(--font-comic);
  background: radial-gradient(circle at center, #140226 0%, #05000c 58%, #000000 100%);
  color: #f3e8ff;
  overflow-x: hidden;
}
.container {
  max-width: 700px;
  width: 100%;
}
h1 {
  font-family: var(--font-papyrus);
  font-size: clamp(2rem, 5vw, 2.8rem);
  margin: 0 0 0.6rem;
  color: #ffd700;
  text-shadow: 0 0 22px rgba(255, 215, 0, 0.45), 2px 2px 4px #000;
  font-weight: normal;
}
.subtitle {
  font-size: 1.05rem;
  color: #c084fc;
  font-style: italic;
  margin-bottom: 2rem;
}
.speech-box {
  background: rgba(255, 255, 255, 0.04);
  border: 2px dashed #ffd700;
  border-radius: 18px;
  padding: 2rem 1.6rem;
  box-shadow: 0 0 36px rgba(168, 85, 247, 0.18);
  min-height: 11rem;
  display: flex;
  align-items: center;
  justify-content: center;
}
.speech-text {
  font-family: var(--font-papyrus);
  font-size: clamp(1.15rem, 3vw, 1.55rem);
  line-height: 1.85;
  color: #f3e8ff;
  white-space: pre-line;
  text-shadow: 0 0 12px rgba(192, 132, 252, 0.4);
}
.cursor {
  display: inline-block;
  width: 0.12em;
  height: 1.05em;
  margin-left: 0.15em;
  vertical-align: text-bottom;
  background: #ffd700;
  box-shadow: 0 0 10px #ffd700;
  animation: blinkCursor 0.75s steps(1) infinite;
}
.credits-card {
  margin-top: 2rem;
  background: rgba(255, 215, 0, 0.07);
  border: 2px solid rgba(255, 215, 0, 0.55);
  border-radius: 18px;
  padding: 1.6rem 1.4rem;
  opacity: 0;
  transform: translateY(10px);
  transition: opacity 0.8s ease, transform 0.8s ease;
  pointer-events: none;
}
.credits-card.visible {
  opacity: 1;
  transform: translateY(0);
  pointer-events: auto;
}
.credits-card h2 {
  font-family: var(--font-papyrus);
  margin: 0 0 0.75rem;
  color: #ffd700;
  font-size: 1.45rem;
}
.credits-card p {
  margin: 0.4rem 0;
  line-height: 1.65;
  color: #f3e8ff;
}
.btn {
  margin-top: 1.75rem;
  padding: 0.85rem 2rem;
  font-size: 1.05rem;
  font-family: var(--font-papyrus);
  background: #ffd700;
  color: #1a0033;
  border: 3px solid #1a0033;
  border-radius: 28px;
  cursor: pointer;
  box-shadow: 0 5px 0 #6c345a;
  transition: transform 0.1s;
}
.btn:active {
  transform: translateY(4px);
  box-shadow: 0 0 0 #6c345a;
}
@keyframes blinkCursor {
  0%, 49% { opacity: 1; }
  50%, 100% { opacity: 0; }
}
</style>
</head>
<body>

<div class="container">
  <h1>The Elation</h1>
  <div class="subtitle">finale &amp; credits</div>

  <div class="speech-box">
    <div class="speech-text"><span id="elationTyped"></span><span class="cursor" id="elationCursor"></span></div>
  </div>

  <!-- EDIT CREDITS PLACEHOLDER TEXT BELOW -->
  <div class="credits-card" id="creditsCard">
    <h2>credits</h2>
    <p>[Placeholder] Made with chaos and laughter.</p>
    <p>[Placeholder] Special thanks to everyone in the server.</p>
    <button type="button" class="btn" onclick="location.href='index.html'">return to the beginning</button>
  </div>
</div>

<script>
// EDIT YOUR ELATION DIALOGUE LINES HERE
const DIALOGUE_LINES = [
  '[Placeholder] Well, well, well... you actually made it to the end, Arsonist.',
  '[Placeholder] Replace these lines with whatever The Elation says in the finale!',
  '[Placeholder] Hope you had a good laugh along the way.'
];

const elationTyped = document.getElementById('elationTyped');
const creditsCard = document.getElementById('creditsCard');

function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

async function playDialogue() {
  await sleep(600);
  let rendered = '';
  for (let li = 0; li < DIALOGUE_LINES.length; li++) {
    const line = DIALOGUE_LINES[li];
    for (let ci = 0; ci < line.length; ci++) {
      rendered += line[ci];
      elationTyped.textContent = rendered;
      const ch = line[ci];
      const delay = ch === ',' ? 120 : (ch === '.' || ch === '!' || ch === '?') ? 210 : 38;
      await sleep(delay);
    }
    if (li < DIALOGUE_LINES.length - 1) {
      rendered += '\n\n';
      elationTyped.textContent = rendered;
      await sleep(500);
    }
  }
  await sleep(450);
  creditsCard.classList.add('visible');
}

playDialogue();
</script>
</body>
</html>
