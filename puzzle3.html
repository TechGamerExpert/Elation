<!DOCTYPE html>
<html lang="en">
<head>

<title>puzzle 3 — friends &amp; pals</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Comic+Neue:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --font-comic: "Comic Sans MS", "Comic Neue", cursive, sans-serif;
  --font-papyrus: "Papyrus", "Cinzel Decorative", fantasy, serif;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 2.5rem 1rem;
  font-family: var(--font-comic);
  background: radial-gradient(circle at center, #140226 0%, #070112 60%, #000000 100%);
  color: #f3e8ff;
  text-align: center;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow-x: hidden;
}
.container {
  width: 100%;
  max-width: 620px;
}
h1 {
  font-family: var(--font-papyrus);
  font-size: clamp(2rem, 5vw, 2.7rem);
  margin: 0 0 0.5rem;
  color: #ffd700;
  text-shadow: 0 0 18px rgba(255, 215, 0, 0.45), 2px 2px 4px #000;
  font-weight: normal;
}
.subtitle {
  font-size: 1.1rem;
  color: #c084fc;
  margin-bottom: 1.75rem;
  font-style: italic;
}
.progress-dots {
  display: flex;
  justify-content: center;
  gap: 0.65rem;
  margin-bottom: 1.5rem;
}
.dot {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  border: 2px solid #ffd700;
  background: transparent;
  transition: background 0.25s, transform 0.25s, box-shadow 0.25s;
}
.dot.done {
  background: #ffd700;
  box-shadow: 0 0 10px rgba(255, 215, 0, 0.7);
}
.dot.active {
  transform: scale(1.25);
  box-shadow: 0 0 12px rgba(192, 132, 252, 0.85);
}

.quiz-card {
  background: rgba(255, 255, 255, 0.05);
  border: 2px dashed #ffd700;
  border-radius: 18px;
  padding: 2rem 1.5rem;
  box-shadow: 0 0 32px rgba(168, 85, 247, 0.16);
}
.quiz-card.shake {
  animation: cardShake 0.35s ease-in-out;
}
.step-label {
  font-family: var(--font-papyrus);
  font-size: 0.95rem;
  letter-spacing: 0.08em;
  color: #c084fc;
  margin-bottom: 0.75rem;
}
.question-text {
  font-size: 1.3rem;
  line-height: 1.55;
  color: #ffd700;
  margin: 0 0 1.5rem;
}
.options-grid {
  display: flex;
  flex-direction: column;
  gap: 0.8rem;
}
.option-btn {
  width: 100%;
  padding: 0.9rem 1.15rem;
  font-family: var(--font-comic);
  font-size: 1.05rem;
  text-align: left;
  color: #f3e8ff;
  background: rgba(255, 255, 255, 0.06);
  border: 2px solid rgba(255, 215, 0, 0.45);
  border-radius: 14px;
  cursor: pointer;
  transition: transform 0.12s, background 0.2s, border-color 0.2s, box-shadow 0.2s;
}
.option-btn:hover:not(:disabled) {
  background: rgba(255, 215, 0, 0.14);
  border-color: #ffd700;
  transform: translateY(-2px);
}
.option-btn:disabled {
  cursor: default;
}
.option-btn.correct {
  background: rgba(34, 197, 94, 0.25);
  border-color: #4ade80;
  color: #dcfce7;
  box-shadow: 0 0 14px rgba(74, 222, 128, 0.35);
}
.option-btn.wrong {
  background: rgba(239, 68, 68, 0.28);
  border-color: #f87171;
  color: #fee2e2;
  box-shadow: 0 0 14px rgba(248, 113, 113, 0.4);
}
.status-msg {
  min-height: 1.5em;
  margin-top: 1.15rem;
  font-size: 0.98rem;
  font-style: italic;
  color: #ff6b6b;
}
.status-msg.good {
  color: #4ade80;
}

.riddles-section {
  display: none;
  text-align: center;
}
.riddles-section.visible {
  display: block;
  animation: fadeIn 0.5s ease-out;
}
.riddles-header {
  margin-bottom: 1.5rem;
}
.riddles-header h2 {
  font-family: var(--font-papyrus);
  margin: 0 0 0.45rem;
  color: #ffd700;
  font-size: 1.75rem;
  text-shadow: 0 0 14px rgba(255, 215, 0, 0.35);
}
.riddles-header p {
  margin: 0;
  color: #c084fc;
  font-style: italic;
}
.riddles-list {
  display: flex;
  flex-direction: column;
  gap: 1.25rem;
}
.riddle-card {
  background: rgba(255, 255, 255, 0.05);
  border: 2px dashed #ffd700;
  border-radius: 18px;
  padding: 1.5rem 1.35rem;
  box-shadow: 0 0 26px rgba(168, 85, 247, 0.14);
  transition: border-color 0.25s, background 0.25s;
}
.riddle-card.solved {
  border-style: solid;
  border-color: #4ade80;
  background: rgba(34, 197, 94, 0.1);
}
.riddle-card.shake {
  animation: cardShake 0.35s ease-in-out;
}
.riddle-title {
  font-family: var(--font-papyrus);
  font-size: 0.95rem;
  color: #c084fc;
  margin-bottom: 0.65rem;
  letter-spacing: 0.06em;
}
.riddle-poem {
  margin: 0 0 1.15rem;
  font-size: 1.08rem;
  line-height: 1.7;
  color: #ffd700;
  white-space: pre-line;
}
.riddle-form {
  display: flex;
  gap: 0.65rem;
  max-width: 390px;
  margin: 0 auto;
  flex-wrap: wrap;
}
.riddle-form input {
  flex: 1 1 190px;
  padding: 0.7rem 0.9rem;
  font-size: 1rem;
  font-family: var(--font-comic);
  text-align: center;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: #ffd700;
  background: rgba(255, 255, 255, 0.07);
  border: 2px dashed rgba(255, 215, 0, 0.65);
  border-radius: 12px;
  outline: none;
}
.riddle-form input::placeholder {
  text-transform: none;
  letter-spacing: normal;
  color: rgba(255, 215, 0, 0.5);
}
.riddle-btn {
  padding: 0.7rem 1.35rem;
  font-size: 0.98rem;
  font-family: var(--font-papyrus);
  background: #ffd700;
  color: #1a0033;
  border: 3px solid #1a0033;
  border-radius: 24px;
  cursor: pointer;
  box-shadow: 0 4px 0 #6c345a;
  transition: transform 0.1s;
}
.riddle-btn:active {
  transform: translateY(3px);
  box-shadow: 0 0 0 #6c345a;
}
.riddle-btn:disabled {
  opacity: 0.6;
  cursor: default;
}
.riddle-status {
  min-height: 1.35em;
  margin-top: 0.75rem;
  font-size: 0.92rem;
  font-style: italic;
  color: #ff6b6b;
}
.riddle-status.good {
  color: #4ade80;
}
.finale-box {
  display: none;
  margin-top: 1.75rem;
  background: rgba(255, 215, 0, 0.1);
  border: 2px solid #ffd700;
  border-radius: 18px;
  padding: 1.75rem 1.4rem;
  box-shadow: 0 0 36px rgba(255, 215, 0, 0.22);
}
.finale-box.visible {
  display: block;
  animation: fadeIn 0.6s ease-out;
}
.finale-box h3 {
  font-family: var(--font-papyrus);
  margin: 0 0 0.6rem;
  color: #ffd700;
  font-size: 1.5rem;
}
.finale-box p {
  margin: 0;
  color: #f3e8ff;
  line-height: 1.65;
}
.fx-layer {
  position: fixed;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
  z-index: 50;
}
.rain-item {
  position: absolute;
  top: -3.5rem;
  user-select: none;
  will-change: transform, opacity;
  animation: rainFall var(--dur, 2.4s) linear var(--delay, 0s) forwards;
}
@keyframes rainFall {
  0% { transform: translateY(0) rotate(0deg); opacity: 0; }
  10% { opacity: 1; }
  90% { opacity: 1; }
  100% { transform: translateY(115vh) rotate(var(--spin, 360deg)); opacity: 0; }
}

/* Void transition screen to Puzzle 4 */
.void-screen {
  position: fixed;
  inset: 0;
  z-index: 60;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 2rem 1.5rem;
  background: radial-gradient(circle at center, #0d0218 0%, #040008 52%, #000000 100%);
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition: opacity 0.9s ease, visibility 0.9s ease;
}
.void-screen.active {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
}
.void-content {
  max-width: 720px;
  width: 100%;
  text-align: center;
}
.void-text {
  font-family: var(--font-papyrus);
  font-size: clamp(1.2rem, 3vw, 1.75rem);
  line-height: 1.8;
  color: #f3e8ff;
  text-shadow: 0 0 14px rgba(192, 132, 252, 0.55), 0 0 32px rgba(255, 215, 0, 0.18);
  white-space: pre-line;
  min-height: 5em;
}
.void-cursor {
  display: inline-block;
  width: 0.12em;
  height: 1.05em;
  margin-left: 0.15em;
  vertical-align: text-bottom;
  background: #ffd700;
  box-shadow: 0 0 10px #ffd700;
  animation: blinkCursor 0.75s steps(1) infinite;
}
.next-trial-wrap {
  margin-top: 2.5rem;
  opacity: 0;
  transform: translateY(10px);
  transition: opacity 0.8s ease, transform 0.8s ease;
  pointer-events: none;
}
.next-trial-wrap.visible {
  opacity: 1;
  transform: translateY(0);
  pointer-events: auto;
}
.void-btn {
  padding: 0.9rem 2rem;
  font-size: 1.15rem;
  font-family: var(--font-papyrus);
  background: #ffd700;
  color: #1a0033;
  border: 4px solid #1a0033;
  border-radius: 30px;
  cursor: pointer;
  box-shadow: 0 6px 0 #6c345a;
  transition: transform 0.1s;
}
.void-btn:active {
  transform: translateY(4px);
  box-shadow: 0 0 0 #6c345a;
}
.void-note {
  margin-top: 1rem;
  font-size: 0.95rem;
  color: #c084fc;
  font-style: italic;
  min-height: 1.4em;
}
@keyframes blinkCursor {
  0%, 49% { opacity: 1; }
  50%, 100% { opacity: 0; }
}

@keyframes cardShake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-8px); }
  40% { transform: translateX(8px); }
  60% { transform: translateX(-6px); }
  80% { transform: translateX(6px); }
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>

<body>

<div class="container">
  <h1>friends &amp; pals</h1>
  <div class="subtitle">answer all 5 to face the riddles.</div>

  <div class="progress-dots" id="progressDots" aria-hidden="true"></div>

  <div class="quiz-card" id="quizCard">
    <div class="step-label" id="stepLabel"></div>
    <p class="question-text" id="questionText"></p>

  </div>

      <h2>the five riddles</h2>

    </div>

    <div class="next-trial-wrap" id="nextTrialWrap">
      <button type="button" class="void-btn" id="nextTrialBtn">enter puzzle 4</button>
      <div class="void-note" id="voidNote"></div>
    </div>
  </div>
</div>

<script>
const QUESTIONS = [
  {
    label: 'Friend 1 of 5 — Isa',
    question: 'What currency does Isa use?',
    options: ['Dong', 'Ringit', 'Rupees', 'Dollar'],
    answerHash: '934fd30a04aff472eb68972e3599dc8c585b8abbb969da21dc1d4ad3f6e0fe43'
  },
  {
    label: 'Friend 2 of 5 — King',
    question: "What is King's Favourite Number?",
    options: ['1', '6', '8', '7'],
    answerHash: '15337326ade477d04e37fa39e15f46d2b2036ad724230ba75ed76e8752bd22a6'
  },
  {
    label: 'Friend 3 of 5 — Daksh',
    question: "What colour is three of Daksh's 4 catto friend?",
    options: ['Black', 'White', 'Brown', 'Purple'],
    answerHash: '946e0cfae2664b312884787497606ffafbf874ee8ee85effbc57ed4776ae885d'
  },
  {
    label: 'Friend 4 of 5',
    question: 'Who out of the options below is equal to a god in the server?',
    options: ['Djay', 'Pras', 'Vanam', 'Hawk'],
    answerHash: '2a0774dab0fcd13f911b2b0fb64fee158df376a5fd086574da1c4668fbfd673a'
  },
  {
    label: 'Friend 5 of 5',
    question: "Who's the most amazing woman?",
    options: ['King', 'Abuwu', 'Aradhyaa', 'Geetha'],
    answerHash: 'ba58c917f9490e1f22ad62e17d6db8748a9928a615e6ac218cc1ca0584c57f7b'
  }
];

const te = new TextEncoder();

const K = new Uint32Array([
  0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5,
  0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174,
  0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,
  0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967,
  0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85,
  0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
  0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3,
  0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2
]);

function sha256BytesSync(data) {
  const len = data.length;
  const bitLen = len * 8;
  const paddedLen = Math.ceil((len + 9) / 64) * 64;
  const padded = new Uint8Array(paddedLen);
  padded.set(data);
  padded[len] = 0x80;
  const dv = new DataView(padded.buffer);
  dv.setUint32(paddedLen - 8, Math.floor(bitLen / 0x100000000), false);
  dv.setUint32(paddedLen - 4, bitLen >>> 0, false);

  let h0 = 0x6a09e667, h1 = 0xbb67ae85, h2 = 0x3c6ef372, h3 = 0xa54ff53a;
  let h4 = 0x510e527f, h5 = 0x9b05688c, h6 = 0x1f83d9ab, h7 = 0x5be0cd19;
  const w = new Uint32Array(64);

  for (let off = 0; off < paddedLen; off += 64) {
    for (let i = 0; i < 16; i++) w[i] = dv.getUint32(off + i * 4, false);
    for (let i = 16; i < 64; i++) {
      const s0 = ((w[i - 15] >>> 7) | (w[i - 15] << 25)) ^ ((w[i - 15] >>> 18) | (w[i - 15] << 14)) ^ (w[i - 15] >>> 3);
      const s1 = ((w[i - 2] >>> 17) | (w[i - 2] << 15)) ^ ((w[i - 2] >>> 19) | (w[i - 2] << 13)) ^ (w[i - 2] >>> 10);
      w[i] = (w[i - 16] + s0 + w[i - 7] + s1) >>> 0;
    }
    let a = h0, b = h1, c = h2, d = h3, e = h4, f = h5, g = h6, h = h7;
    for (let i = 0; i < 64; i++) {
      const S1 = ((e >>> 6) | (e << 26)) ^ ((e >>> 11) | (e << 21)) ^ ((e >>> 25) | (e << 7));
      const ch = (e & f) ^ ((~e) & g);
      const t1 = (h + S1 + ch + K[i] + w[i]) >>> 0;
      const S0 = ((a >>> 2) | (a << 30)) ^ ((a >>> 13) | (a << 19)) ^ ((a >>> 22) | (a << 10));
      const maj = (a & b) ^ (a & c) ^ (b & c);
      const t2 = (S0 + maj) >>> 0;
      h = g; g = f; f = e; e = (d + t1) >>> 0;
      d = c; c = b; b = a; a = (t1 + t2) >>> 0;
    }
    h0 = (h0 + a) >>> 0; h1 = (h1 + b) >>> 0; h2 = (h2 + c) >>> 0; h3 = (h3 + d) >>> 0;
    h4 = (h4 + e) >>> 0; h5 = (h5 + f) >>> 0; h6 = (h6 + g) >>> 0; h7 = (h7 + h) >>> 0;
  }

  const out = new Uint8Array(32);
  const outView = new DataView(out.buffer);
  [h0, h1, h2, h3, h4, h5, h6, h7].forEach((v, idx) => outView.setUint32(idx * 4, v, false));
  return out;
}

function bytesToHex(bytes) {
  return Array.from(bytes, b => b.toString(16).padStart(2, '0')).join('');
}

function concatBytes(a, b) {
  const out = new Uint8Array(a.length + b.length);
  out.set(a, 0);
  out.set(b, a.length);
  return out;
}

function hmacSha256Sync(key, msg) {
  const k = key.length > 64 ? sha256BytesSync(key) : key;
  const ipad = new Uint8Array(64);
  const opad = new Uint8Array(64);
  ipad.fill(0x36);
  opad.fill(0x5c);
  for (let i = 0; i < k.length; i++) {
    ipad[i] ^= k[i];
    opad[i] ^= k[i];
  }
  return sha256BytesSync(concatBytes(opad, sha256BytesSync(concatBytes(ipad, msg))));
}

function pbkdf2Sha256Sync(passwordBytes, saltBytes, iterations) {
  const block1 = new Uint8Array(saltBytes.length + 4);
  block1.set(saltBytes, 0);
  block1[saltBytes.length + 3] = 1;
  let u = hmacSha256Sync(passwordBytes, block1);
  const out = new Uint8Array(u);
  for (let i = 1; i < iterations; i++) {
    u = hmacSha256Sync(passwordBytes, u);
    for (let j = 0; j < 32; j++) out[j] ^= u[j];
  }
  return out;
}

async function hashOption(qIdx, optIdx) {
  const bytes = te.encode(`elation-p3-q${qIdx}:${optIdx}`);
  if (window.crypto && window.crypto.subtle) {
    const buf = await window.crypto.subtle.digest('SHA-256', bytes);
    return bytesToHex(new Uint8Array(buf));
  }
  return bytesToHex(sha256BytesSync(bytes));
}

const td = new TextDecoder();
const FINALE_SALT = 'elation-p3-finale-salt';
const FINALE_TAG_B64 = 'c+FMkaAdDqFLxqZ3sAus7VNr8Md/wPCFwAffyekC+Sk=';
const FINALE_CT_B64 = 'tau5AMv2/2JVfpKnSyKcTXDaxNiB2ZRFHVZZxGHdmeJEteJ9W9StPWTzuRvhGohjoIu3bPVX9mORmt+jZv10hJe7FuWBsHT8XRlMFqENf4N1U3yTidhW0sUZ1UZ2WlYMUgffKSo76c+ka4hogHvopjkGIL7S0YFe7rl3ZjHzsdpwOAPwFr9qCQdWTJGEM18Z7VXOYNvcjGCujq7GBGyVYd6GMFH3sxUel26t85fnXx7x8j3cImLFgjCWj76ByXcXcPZe1GwOv4x+iC+VsPHJ3sxVWnqF/z7DtJA+lhLD34Ce0IJayGiYbsxZXg==';

function b64ToBytes(b64) {
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

async function sha256Bytes(data) {
  if (window.crypto && window.crypto.subtle) {
    return new Uint8Array(await window.crypto.subtle.digest('SHA-256', data));
  }
  return sha256BytesSync(data);
}

async function pbkdf2Bytes(passStr, saltStr, iterations) {
  const passBytes = te.encode(passStr);
  const saltBytes = te.encode(saltStr);
  if (window.crypto && window.crypto.subtle) {
    const keyMat = await window.crypto.subtle.importKey('raw', passBytes, 'PBKDF2', false, ['deriveBits']);
    const bits = await window.crypto.subtle.deriveBits(
      { name: 'PBKDF2', salt: saltBytes, iterations, hash: 'SHA-256' },
      keyMat,
      256
    );
    return new Uint8Array(bits);
  }
  return pbkdf2Sha256Sync(passBytes, saltBytes, iterations);
}

async function hashRiddleGuess(rIdx, guess) {
  const bytes = await pbkdf2Bytes(guess.trim().toLowerCase(), `elation-p3-riddle-${rIdx}-salt`, 100000);
  return bytesToHex(bytes);
}

async function decryptFinale(words) {
  const master = await pbkdf2Bytes(words.map(w => w.trim().toLowerCase()).join(':'), FINALE_SALT, 100000);
  const encKey = await sha256Bytes(concatBytes(te.encode('enc:'), master));
  const macKey = await sha256Bytes(concatBytes(te.encode('mac:'), master));

  const ct = b64ToBytes(FINALE_CT_B64);
  const expectedTag = b64ToBytes(FINALE_TAG_B64);
  const actualTag = await sha256Bytes(concatBytes(macKey, ct));

  let diff = 0;
  for (let i = 0; i < 32; i++) diff |= expectedTag[i] ^ actualTag[i];
  if (diff !== 0) return null;

  const pt = new Uint8Array(ct.length);
  const ctrBuf = new Uint8Array(4);
  const ctrView = new DataView(ctrBuf.buffer);
  for (let offset = 0, ctr = 0; offset < ct.length; offset += 32, ctr++) {
    ctrView.setUint32(0, ctr, false);
    const block = await sha256Bytes(concatBytes(encKey, ctrBuf));
    for (let i = 0; i < 32 && offset + i < ct.length; i++) {
      pt[offset + i] = ct[offset + i] ^ block[i];
    }
  }
  return JSON.parse(td.decode(pt));
}

  {
    title: 'Riddle 1',
    poem: "Question the authority, the Monarch who sleeps,\nFor an Anarchist must not weep!",
    answerHash: '2e0a013f192480dcc0aa536c7f18c5c3331c968f29d98cea634555a5865a6e28'

const progressDots = document.getElementById('progressDots');
const quizCard = document.getElementById('quizCard');
const stepLabel = document.getElementById('stepLabel');
const questionText = document.getElementById('questionText');
const optionsGrid = document.getElementById('optionsGrid');
const statusMsg = document.getElementById('statusMsg');
const riddlesSection = document.getElementById('riddlesSection');
const riddlesProgress = document.getElementById('riddlesProgress');
const riddlesList = document.getElementById('riddlesList');
const finaleBox = document.getElementById('finaleBox');
const finaleSummary = document.getElementById('finaleSummary');
const fxLayer = document.getElementById('fxLayer');
const voidScreen = document.getElementById('voidScreen');
const voidTyped = document.getElementById('voidTyped');
const nextTrialWrap = document.getElementById('nextTrialWrap');
const nextTrialBtn = document.getElementById('nextTrialBtn');
const voidNote = document.getElementById('voidNote');

const solvedWords = new Array(RIDDLES.length).fill(null);

function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

async function playVoidTransition(text) {
  voidScreen.classList.add('active');
  await sleep(800);

  let rendered = '';
  for (let i = 0; i < text.length; i++) {
    rendered += text[i];
    voidTyped.textContent = rendered;
    const ch = text[i];
    const delay = ch === ',' ? 130 : (ch === '.' || ch === '?' || ch === '!') ? 220 : 38;
    await sleep(delay);
  }

  await sleep(400);
  nextTrialWrap.classList.add('visible');
}

nextTrialBtn.addEventListener('click', () => {
  location.href = 'puzzle4.html';
});

function rainCelebration() {
  const icons = ['😂', '✨', '🔮', '💛'];
  for (let i = 0; i < 60; i++) {
    const el = document.createElement('span');
    el.className = 'rain-item';
    el.textContent = icons[Math.floor(Math.random() * icons.length)];
    el.style.left = `${Math.random() * 96}vw`;
    el.style.fontSize = `${1.7 + Math.random() * 1.6}rem`;
    el.style.setProperty('--dur', `${1.7 + Math.random() * 1.3}s`);
    el.style.setProperty('--delay', `${Math.random() * 1.0}s`);
    el.style.setProperty('--spin', `${(Math.random() < 0.5 ? -1 : 1) * (180 + Math.random() * 360)}deg`);
    fxLayer.appendChild(el);
    setTimeout(() => el.remove(), 3300);
  }
}

async function updateRiddleProgress() {
  const count = solvedWords.filter(Boolean).length;
  riddlesProgress.textContent = `${count} / ${RIDDLES.length} solved — uncover all five keywords, erudite.`;
  if (count === RIDDLES.length) {
    finaleSummary.textContent = `Keywords unlocked: ${solvedWords.join(' · ')}.`;
    finaleBox.classList.add('visible');
    rainCelebration();
    const payload = await decryptFinale(solvedWords);
    if (payload && typeof payload.text === 'string') {
      await sleep(2200);
      await playVoidTransition(payload.text);
    }
  }
}

function renderRiddles() {
  const cards = RIDDLES.map((r, rIdx) => {
    const card = document.createElement('div');
    card.className = 'riddle-card';

    const title = document.createElement('div');
    title.className = 'riddle-title';
    title.textContent = r.title;

    const poem = document.createElement('p');
    poem.className = 'riddle-poem';
    poem.textContent = r.poem;

    const form = document.createElement('form');
    form.className = 'riddle-form';

    const input = document.createElement('input');
    input.type = 'text';
    input.autocomplete = 'off';
    input.placeholder = 'enter keyword...';
    input.required = true;

    const btn = document.createElement('button');
    btn.type = 'submit';
    btn.className = 'riddle-btn';
    btn.textContent = 'unlock';

    const status = document.createElement('div');
    status.className = 'riddle-status';

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (solvedWords[rIdx]) return;
      const guess = input.value.trim();
      if (!guess) return;

      btn.disabled = true;
      input.disabled = true;
      status.className = 'riddle-status';
      status.textContent = 'checking...';

      try {
        const digest = await hashRiddleGuess(rIdx, guess);
        if (digest === r.answerHash) {
          const word = guess.toUpperCase();
          solvedWords[rIdx] = word;
          card.classList.add('solved');
          status.className = 'riddle-status good';
          status.textContent = `unlocked: ${word}`;
          btn.textContent = 'solved';
          updateRiddleProgress();
        } else {
          status.textContent = 'not quite. read closer.';
          btn.disabled = false;
          input.disabled = false;
          card.classList.remove('shake');
          void card.offsetWidth;
          card.classList.add('shake');
          input.select();
        }
      } catch (err) {
        console.error(err);
        status.textContent = 'something malfunctioned. try again.';
        btn.disabled = false;
        input.disabled = false;
      }
    });

    form.append(input, btn);
    card.append(title, poem, form, status);
    return card;
  });
  riddlesList.replaceChildren(...cards);
}

let currentIdx = 0;
let locked = false;

function renderDots() {
  const dots = QUESTIONS.map((_, idx) => {
    const dot = document.createElement('span');
    dot.className = 'dot';
    if (idx < currentIdx) dot.classList.add('done');
    else if (idx === currentIdx) dot.classList.add('active');
    return dot;
  });
  progressDots.replaceChildren(...dots);
}

function shuffleOptions(options) {
  const indexed = options.map((text, origIdx) => ({ text, origIdx }));
  for (let i = indexed.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [indexed[i], indexed[j]] = [indexed[j], indexed[i]];
  }
  return indexed;
}

function renderQuestion() {
  locked = false;
  renderDots();
  const q = QUESTIONS[currentIdx];
  stepLabel.textContent = q.label;
  questionText.textContent = q.question;
  statusMsg.textContent = '';
  statusMsg.className = 'status-msg';

  const shuffled = shuffleOptions(q.options);
  const buttons = shuffled.map((opt, displayIdx) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'option-btn';
    btn.textContent = `${displayIdx + 1}. ${opt.text}`;
    btn.addEventListener('click', () => handleChoice(opt.origIdx, btn));
    return btn;
  });
  optionsGrid.replaceChildren(...buttons);
}

async function handleChoice(optIdx, clickedBtn) {
  if (locked) return;
  locked = true;

  const allBtns = Array.from(optionsGrid.querySelectorAll('.option-btn'));
  allBtns.forEach(b => { b.disabled = true; });

  const digest = await hashOption(currentIdx, optIdx);
  const isCorrect = digest === QUESTIONS[currentIdx].answerHash;

  if (isCorrect) {
    clickedBtn.classList.add('correct');
    statusMsg.className = 'status-msg good';
    statusMsg.textContent = 'correct!';

    setTimeout(() => {
      currentIdx += 1;
      if (currentIdx >= QUESTIONS.length) {
        renderDots();
        quizCard.style.display = 'none';
        renderRiddles();
        riddlesSection.classList.add('visible');
      } else {
        renderQuestion();
      }
    }, 650);
  } else {
    clickedBtn.classList.add('wrong');
    statusMsg.className = 'status-msg';
    statusMsg.textContent = 'wrong! back to friend 1, erudite.';
    quizCard.classList.remove('shake');
    void quizCard.offsetWidth;
    quizCard.classList.add('shake');

    setTimeout(() => {
      currentIdx = 0;
      renderQuestion();
    }, 1100);
  }
}

renderQuestion();
